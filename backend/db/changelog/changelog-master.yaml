# The Scenery — Liquibase master changelog.
# Changesets are included in order; each is formatted SQL with a --rollback block
# (see DESIGN.md §3.5). The changelog — not the SQLAlchemy models — is the source
# of truth for the schema.
databaseChangeLog:
  - include:
      file: changesets/001-genres.sql
      relativeToChangelogFile: true
  - include:
      file: changesets/002-locations.sql
      relativeToChangelogFile: true
  - include:
      file: changesets/003-scenes-and-signals.sql
      relativeToChangelogFile: true
  - include:
      file: changesets/004-conversations.sql
      relativeToChangelogFile: true
  - include:
      file: changesets/005-seed-data.sql
      relativeToChangelogFile: true
